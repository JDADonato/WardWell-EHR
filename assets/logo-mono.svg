<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 64" fill="none">
  <!-- WardWell Logo Mark (Monochrome Print) -->
  <g class="logo-mark" transform="translate(4, 4)">
    <rect width="56" height="56" rx="14" fill="#000000" fill-opacity="0.06"/>
    <!-- Vertical Leaf Blades -->
    <path d="M28 8 C22 15 23 21 28 25 C33 21 34 15 28 8 Z" fill="#000000"/>
    <path d="M28 48 C22 41 23 35 28 31 C33 35 34 41 28 48 Z" fill="#000000"/>
    <!-- Horizontal Leaf Blades -->
    <path d="M8 28 C15 22 21 23 25 28 C21 33 15 34 8 28 Z" fill="#444444"/>
    <path d="M48 28 C41 22 35 23 31 28 C35 33 41 34 48 28 Z" fill="#444444"/>
    <!-- Center Node -->
    <circle cx="28" cy="28" r="4" fill="#000000"/>
    <circle cx="28" cy="28" r="1.5" fill="#ffffff"/>
  </g>

  <!-- Wordmark -->
  <g class="logo-text" transform="translate(70, 14)">
    <text x="0" y="22" font-family="'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="22" letter-spacing="-0.02em" fill="#000000">Ward<tspan fill="#333333">Well</tspan></text>
    <rect x="106" y="7" width="38" height="18" rx="9" fill="#000000" fill-opacity="0.08"/>
    <text x="125" y="20" text-anchor="middle" font-family="'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="10" letter-spacing="0.08em" fill="#000000">EHR</text>
    <text x="0" y="38" font-family="'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="9.5" letter-spacing="0.02em" fill="#555555">WardWell General Hospital</text>
  </g>
</svg>
